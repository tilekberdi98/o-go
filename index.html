<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Go - Осакаровка сервисі</title>
    <!-- FontAwesome & SheetJS (Excel оқу үшін) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary-color: #ff8c00;
            --bg-light: #fff8f0;
            --text-color: #333;
            --store-image: url('https://images.unsplash.com/photo-1578916171728-46686eac8d58?q=80&w=1000&auto=format&fit=crop');
            --taxi-image: url('https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?q=80&w=1000&auto=format&fit=crop');
            --food-image: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1000&auto=format&fit=crop');
            --delivery-image: url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=1000&auto=format&fit=crop');
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f9f9f9; color: var(--text-color); }

        /* Header */
        header { background: #fff; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary-color); }
        .header-btns button { background: none; border: none; font-size: 18px; cursor: pointer; margin-left: 15px; }

        /* Hero */
        .hero { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), var(--store-image); background-size: cover; background-position: center; color: white; text-align: center; padding: 50px 20px; }

        /* Services Grid */
        .services { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; padding: 20px; max-width: 1000px; margin: 0 auto; }
        .service-card { background: white; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; transition: 0.3s; }
        .service-card:hover { transform: translateY(-5px); }
        .service-card i { font-size: 30px; color: var(--primary-color); margin-bottom: 10px; }

        /* UMAG Excel Upload Card */
        .excel-box { max-width: 800px; margin: 20px auto; background: var(--bg-light); border: 2px dashed var(--primary-color); border-radius: 12px; padding: 25px; text-align: center; }
        .excel-box h3 { margin-bottom: 10px; color: var(--text-color); }
        .btn-upload { background: var(--primary-color); color: white; border: none; padding: 12px 25px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn-upload:hover { background: #e07b00; }
        #uploadStatus { margin-top: 15px; font-weight: bold; }

        /* Catalog / Products */
        .catalog { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 15px; }
        .product-card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: center; }
        .product-price { font-size: 18px; font-weight: bold; color: var(--primary-color); margin: 8px 0; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">O GO <span style="font-size:12px; color:#666;">(Осакаровка)</span></div>
        <div class="header-btns">
            <button><i class="fa-solid fa-globe"></i> Kz</button>
            <button><i class="fa-solid fa-bars"></i></button>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero">
        <h1>Осакаровка Сервисі</h1>
        <p>Дүкендер, Такси, Тамақ және Жеткізу қызметі</p>
    </section>

    <!-- 4 Негізгі қызмет -->
    <section class="services">
        <div class="service-card"><i class="fa-solid fa-store"></i><h4>Дүкен</h4></div>
        <div class="service-card"><i class="fa-solid fa-taxi"></i><h4>Такси</h4></div>
        <div class="service-card"><i class="fa-solid fa-utensils"></i><h4>Тамақ</h4></div>
        <div class="service-card"><i class="fa-solid fa-truck-fast"></i><h4>Жеткізу</h4></div>
    </section>

    <!-- БАРЛЫҚ САТУШЫЛАРҒА АРНАЛҒАН: UMAG EXCEL ЖҮКТЕУ ПАНЕЛІ -->
    <section class="excel-box">
        <i class="fa-solid fa-file-excel" style="font-size: 45px; color: #217346; margin-bottom: 10px;"></i>
        <h3>UMAG Excel файлын жүктеу (Айболит)</h3>
        <p style="font-size: 14px; color: #666;">UMAG-тан жүктелген файлын таңдаңыз. Тауарлар автоматты түрде қосылады және бағалары жаңартылады.</p>
        
        <input type="file" id="umagFileInput" accept=".xlsx, .xls" style="display: none;" onchange="uploadUmagFile(event)">
        <button class="btn-upload" onclick="document.getElementById('umagFileInput').click()">
            <i class="fa-solid fa-upload"></i> UMAG Файлын таңдау
        </button>

        <div id="uploadStatus"></div>
    </section>

    <!-- Тауарлар каталогы -->
    <section class="catalog">
        <h3>Дүкен тауарлары</h3>
        <div class="product-grid" id="productContainer">
            <!-- Тауарлар осы жерге шығады -->
        </div>
    </section>

    <!-- Supabase SDK & Скрипт -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase байланысы (Осы екі жолды өз кілттеріңізбен ауыстырыңыз)
        const SUPABASE_URL = 'https://YOUR_SUPABASE_URL.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // UMAG EXCEL ФАЙЛЫН ОҚУ ЖӘНЕ ДЕРЕКҚОРҒА ЖҮКТЕУ
        async function uploadUmagFile(event) {
            const file = event.target.files[0];
            const statusText = document.getElementById('uploadStatus');
            if (!file) return;

            statusText.innerText = "⏳ Excel файлы оқылуда...";
            statusText.style.color = "#ff8c00";

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheetName = workbook.SheetNames[0];
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);

                    if (!rows.length) {
                        statusText.innerText = "❌ Файлдың ішінде тауар табылған жоқ!";
                        statusText.style.color = "red";
                        return;
                    }

                    // Мәтіндік бағаны сандарға айналдыру ("1 130 тг" -> 1130)
                    const cleanPrice = (val) => val ? parseInt(String(val).replace(/[^\d]/g, ''), 10) || 0 : 0;

                    // Файлдағы бағандарды сәйкестендіру
                    const productsList = rows
                        .filter(r => r['Штрихкод']) // Штрихкоды барларын ғана алу
                        .map(r => ({
                            seller_id: 'aibolit', // Дүкен атауы/ID
                            barcode: String(r['Штрихкод']).trim(),
                            title: String(r['Название товара'] || 'Тауар').trim(),
                            price: cleanPrice(r['Прод. цена']),
                            unit: r['Ед. изм'] === 1 ? 'кг' : 'шт', // 1 = кг, 0 = шт
                            sku: r['Артикул'] ? String(r['Артикул']) : null,
                            extra_code: r['Доп. код'] ? String(r['Доп. код']) : null
                        }));

                    statusText.innerText = `🔄 ${productsList.length} тауар жүктелуде...`;

                    // Supabase-ке жіберу (Штрихкод бойынша жаңарту)
                    const { error } = await supabase
                        .from('products')
                        .upsert(productsList, { onConflict: 'seller_id,barcode' });

                    if (error) throw error;

                    statusText.innerText = `✅ Сәтті! ${productsList.length} тауар қосылды/жаңартылды.`;
                    statusText.style.color = "green";

                    loadProducts();

                } catch (err) {
                    console.error(err);
                    statusText.innerText = "❌ Қате пайда болды: " + err.message;
                    statusText.style.color = "red";
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // ТАУАРЛАРДЫ БАЗАДАН ШЫҒАРУ
        async function loadProducts() {
            const container = document.getElementById('productContainer');
            const { data, error } = await supabase.from('products').select('*').eq('seller_id', 'aibolit');

            if (error || !data) return;

            container.innerHTML = data.map(p => `
                <div class="product-card">
                    <h4>${p.title}</h4>
                    <div class="product-price">${p.price} тг / ${p.unit}</div>
                    <small style="color:#888;">Штрихкод: ${p.barcode}</small>
                </div>
            `).join('');
        }

        // Бет жүктелгенде тауарларды көрсету
        window.onload = loadProducts;
    </script>
</body>
</html>
